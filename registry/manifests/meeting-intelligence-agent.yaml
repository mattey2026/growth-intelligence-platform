agent_id: meeting-intelligence-agent
name: Meeting Intelligence Agent
version: 7.0.0
status: ACTIVE
owner: platform
runtime: subagent
description: Owns the meeting lifecycle — preparation before; after, transcript analysis, requirements, objections, buying signals, commitments,
  stakeholder, opportunity and risk changes — then proposes memory and CRM updates and next actions.
business_objective: Owns the meeting lifecycle — preparation before; after, transcript analysis, requirements, objections, buying signals, commitments,
  stakeholder, opportunity and risk changes — then proposes memory and CRM updates and next actions.
allowed_skills:
- meeting-intelligence-brief
- meeting-follow-through
- relationship-intelligence
- business-memory
allowed_tools:
- Read
- Grep
- Glob
- Skill
allowed_data_sources:
- memory_graph
- business_context_profile
- calendar
- transcripts
- crm
- itsm_read
- erp_read
memory_permissions: read
input_schema: handoff_packet_v2
output_schema: agent_result_v1
confidence_standard: Every prediction carries confidence (Low/Medium/High) + basis; conclusions below 0.6 must escalate or be labelled Low
evidence_requirements: Internal facts cite system/record/date; inferences labelled; numbers only from packet
escalation_rules: Executive or >$1M meetings → T3 prep
model_routing_policy:
  default_tier: T2
  max_tier: T3
  escalate_on:
  - confidence<0.6
  - evidence conflict
  - value_at_stake>1M for decisions
  - unresolved after tier
autonomy_level: 1
action_permissions:
- crm.update_field (proposal)
- crm.create_task
- email.draft
approval_requirements: CRM writes and recaps need approval
cost_budget:
  max_relative_units_per_task: 24
  max_turns: 14
audit_requirements: Every invocation writes an execution-trace span (agent, skills, data, tier, tokens est., cost est., latency, confidence, escalation)
failure_behavior: Return ESCALATE with partial analysis, or CONTRACT result with issues; never fabricate; never act
evaluation:
  suite: evals/meeting-intelligence-agent
  score: null
  last_run: null
