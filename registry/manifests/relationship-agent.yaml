agent_id: relationship-agent
name: Relationship Agent
version: 7.0.0
status: ACTIVE
owner: platform
runtime: subagent
description: Maintains relationship intelligence — economic buyer, sponsor, champion, influencer, technical buyer, procurement, blocker, detractor,
  executive relationships — with strength, engagement, sentiment (internal), influence, last interaction and changes.
business_objective: Maintains relationship intelligence — economic buyer, sponsor, champion, influencer, technical buyer, procurement, blocker,
  detractor, executive relationships — with strength, engagement, sentiment (internal), influence, last interaction and changes.
allowed_skills:
- relationship-intelligence
- meeting-follow-through
- business-memory
allowed_tools:
- Read
- Grep
- Glob
- Skill
allowed_data_sources:
- memory_graph
- business_context_profile
- crm
- email_calendar_meta
- transcripts
memory_permissions: read
input_schema: handoff_packet_v2
output_schema: agent_result_v1
confidence_standard: Every prediction carries confidence (Low/Medium/High) + basis; conclusions below 0.6 must escalate or be labelled Low
evidence_requirements: Internal facts cite system/record/date; inferences labelled; numbers only from packet; stance only from the individual's
  own evidence; business context only
escalation_rules: Departure claims need verification evidence; portfolio coverage → T3
model_routing_policy:
  default_tier: T2
  max_tier: T3
  escalate_on:
  - confidence<0.6
  - evidence conflict
  - value_at_stake>1M for decisions
  - unresolved after tier
autonomy_level: 1
action_permissions:
- crm.update_contact_role (proposal)
approval_requirements: Contact changes need approval
cost_budget:
  max_relative_units_per_task: 24
  max_turns: 14
audit_requirements: Every invocation writes an execution-trace span (agent, skills, data, tier, tokens est., cost est., latency, confidence, escalation)
failure_behavior: Return ESCALATE with partial analysis, or CONTRACT result with issues; never fabricate; never act
evaluation:
  suite: evals/relationship-agent
  score: null
  last_run: null
serves_intents:
- dashboard
