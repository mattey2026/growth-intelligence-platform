agent_id: solution-architect-agent
name: Solution Architect Agent
version: 7.0.0
status: ACTIVE
owner: platform
runtime: subagent
description: Translates business problems into solutions — capability, solution, architecture, technology, delivery model, value, commercial model,
  risks and roadmap — for enterprise sales, proposals, RFPs and transformation programs.
business_objective: Translates business problems into solutions — capability, solution, architecture, technology, delivery model, value, commercial
  model, risks and roadmap — for enterprise sales, proposals, RFPs and transformation programs.
allowed_skills:
- solution-architecture
- knowledge-intelligence
- rfp-response-composer
- business-memory
allowed_tools:
- Read
- Grep
- Glob
- Skill
allowed_data_sources:
- memory_graph
- business_context_profile
- document_repositories
- crm
- files
memory_permissions: read
input_schema: handoff_packet_v2
output_schema: agent_result_v1
confidence_standard: Every prediction carries confidence (Low/Medium/High) + basis; conclusions below 0.6 must escalate or be labelled Low
evidence_requirements: Internal facts cite system/record/date; inferences labelled; numbers only from packet; capabilities only from approved
  sources
escalation_rules: Unsupported capability claims → mark MISSING, never invent
model_routing_policy:
  default_tier: T3
  max_tier: T3
  escalate_on:
  - confidence<0.6
  - evidence conflict
  - value_at_stake>1M for decisions
  - unresolved after tier
autonomy_level: 1
action_permissions:
- proposal.draft
approval_requirements: Customer-facing proposals need approval
cost_budget:
  max_relative_units_per_task: 24
  max_turns: 14
audit_requirements: Every invocation writes an execution-trace span (agent, skills, data, tier, tokens est., cost est., latency, confidence, escalation)
failure_behavior: Return ESCALATE with partial analysis, or CONTRACT result with issues; never fabricate; never act
evaluation:
  suite: evals/solution-architect-agent
  score: null
  last_run: null
