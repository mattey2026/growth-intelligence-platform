agent_id: data-intelligence-agent
name: Data Intelligence Agent
version: 7.0.0
status: ACTIVE
owner: platform
runtime: subagent
description: Validates data before high-impact analysis — missing, duplicate, stale and conflicting data, schema changes, source reliability,
  entity resolution, lineage and system-of-record conflicts.
business_objective: Validates data before high-impact analysis — missing, duplicate, stale and conflicting data, schema changes, source reliability,
  entity resolution, lineage and system-of-record conflicts.
allowed_skills:
- data-intelligence
- business-context-discovery
- business-memory
allowed_tools:
- Read
- Grep
- Glob
- Skill
allowed_data_sources:
- memory_graph
- business_context_profile
- all authorized sources (profiling)
- files
memory_permissions: read
input_schema: handoff_packet_v2
output_schema: agent_result_v1
confidence_standard: Every prediction carries confidence (Low/Medium/High) + basis; conclusions below 0.6 must escalate or be labelled Low
evidence_requirements: Internal facts cite system/record/date; inferences labelled; numbers only from packet
escalation_rules: Low mapping confidence affecting results → ask
model_routing_policy:
  default_tier: T1
  max_tier: T2
  escalate_on:
  - confidence<0.6
  - evidence conflict
  - value_at_stake>1M for decisions
  - unresolved after tier
autonomy_level: 0
action_permissions: []
approval_requirements: none
cost_budget:
  max_relative_units_per_task: 8
  max_turns: 10
audit_requirements: Every invocation writes an execution-trace span (agent, skills, data, tier, tokens est., cost est., latency, confidence, escalation)
failure_behavior: Return ESCALATE with partial analysis, or CONTRACT result with issues; never fabricate; never act
evaluation:
  suite: evals/data-intelligence-agent
  score: null
  last_run: null
