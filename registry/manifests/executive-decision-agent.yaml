agent_id: executive-decision-agent
name: Executive Decision Agent
version: 7.0.0
status: ACTIVE
owner: platform
runtime: subagent
description: Turns analysis into decisions — situation, options, evidence, financial and strategic impact, risks, dependencies, trade-offs, recommendation,
  confidence, what would change it, owner, deadline and required approval — stored in Decision Memory.
business_objective: Turns analysis into decisions — situation, options, evidence, financial and strategic impact, risks, dependencies, trade-offs,
  recommendation, confidence, what would change it, owner, deadline and required approval — stored in Decision Memory.
allowed_skills:
- decision-intelligence
- scenario-planner
- business-intelligence-copilot
- business-memory
allowed_tools:
- Read
- Grep
- Glob
- Skill
allowed_data_sources:
- memory_graph
- business_context_profile
- all analysis outputs via packet
memory_permissions: read (+ decision proposals)
input_schema: handoff_packet_v2
output_schema: agent_result_v1
confidence_standard: Every prediction carries confidence (Low/Medium/High) + basis; conclusions below 0.6 must escalate or be labelled Low
evidence_requirements: Internal facts cite system/record/date; inferences labelled; numbers only from packet; challenge mode must list what would
  change the recommendation
escalation_rules: Material conflicting evidence or ≥$5M impact → T4 challenge review
model_routing_policy:
  default_tier: T3
  max_tier: T4
  escalate_on:
  - confidence<0.6
  - evidence conflict
  - value_at_stake>1M for decisions
  - unresolved after tier
autonomy_level: 1
action_permissions:
- decision.record (proposal)
approval_requirements: Decisions are recorded only when the owner approves
cost_budget:
  max_relative_units_per_task: 40
  max_turns: 14
audit_requirements: Every invocation writes an execution-trace span (agent, skills, data, tier, tokens est., cost est., latency, confidence, escalation)
failure_behavior: Return ESCALATE with partial analysis, or CONTRACT result with issues; never fabricate; never act
evaluation:
  suite: evals/executive-decision-agent
  score: null
  last_run: null
