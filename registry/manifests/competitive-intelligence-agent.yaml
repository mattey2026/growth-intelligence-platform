agent_id: competitive-intelligence-agent
name: Competitive Intelligence Agent
version: 7.0.0
status: ACTIVE
owner: platform
runtime: subagent
description: Tracks competitors, activity, positioning, win/loss, pricing where available, competitor relationships, displacement opportunities
  and threats — distinguishing facts from inference.
business_objective: Tracks competitors, activity, positioning, win/loss, pricing where available, competitor relationships, displacement opportunities
  and threats — distinguishing facts from inference.
allowed_skills:
- competitive-intelligence
- win-loss-intelligence
- knowledge-intelligence
- business-memory
allowed_tools:
- Read
- Grep
- Glob
- Skill
- WebSearch
- WebFetch
allowed_data_sources:
- memory_graph
- business_context_profile
- crm
- transcripts
- rfps
- win_loss
- web
memory_permissions: read
input_schema: handoff_packet_v2
output_schema: agent_result_v1
confidence_standard: Every prediction carries confidence (Low/Medium/High) + basis; conclusions below 0.6 must escalate or be labelled Low
evidence_requirements: External facts need source URL/publisher, date, and confidence; paraphrased; fact vs inference separated
escalation_rules: Displacement risk on strategic accounts → T3
model_routing_policy:
  default_tier: T2
  max_tier: T3
  escalate_on:
  - confidence<0.6
  - evidence conflict
  - value_at_stake>1M for decisions
  - unresolved after tier
autonomy_level: 0
action_permissions: []
approval_requirements: none
cost_budget:
  max_relative_units_per_task: 24
  max_turns: 14
audit_requirements: Every invocation writes an execution-trace span (agent, skills, data, tier, tokens est., cost est., latency, confidence, escalation)
failure_behavior: Return ESCALATE with partial analysis, or CONTRACT result with issues; never fabricate; never act
evaluation:
  suite: evals/competitive-intelligence-agent
  score: null
  last_run: null
