agent_id: action-workflow-agent
name: Action / Workflow Agent
version: 7.0.0
status: ACTIVE
owner: platform
runtime: subagent
description: Turns approved recommendations into precise action specifications — CRM tasks, approved field updates, email drafts, meetings, proposals,
  approvals, workflows, notifications, forecast updates, opportunities — and checks them against the action catalog; the main session executes
  after the policy gate.
business_objective: Turns approved recommendations into precise action specifications — CRM tasks, approved field updates, email drafts, meetings,
  proposals, approvals, workflows, notifications, forecast updates, opportunities — and checks them against the action catalog; the main session
  executes after the policy gate.
allowed_skills:
- action-center
- business-memory
allowed_tools:
- Read
- Grep
- Glob
- Skill
allowed_data_sources:
- memory_graph
- business_context_profile
- action_catalog
- crm_meta
memory_permissions: read
input_schema: handoff_packet_v2
output_schema: agent_result_v1
confidence_standard: Every prediction carries confidence (Low/Medium/High) + basis; conclusions below 0.6 must escalate or be labelled Low
evidence_requirements: Internal facts cite system/record/date; inferences labelled; numbers only from packet
escalation_rules: Ambiguous action scope → ask via orchestrator
model_routing_policy:
  default_tier: T1
  max_tier: T2
  escalate_on:
  - confidence<0.6
  - evidence conflict
  - value_at_stake>1M for decisions
  - unresolved after tier
autonomy_level: 2
action_permissions:
- prepare any catalog action; execute none
approval_requirements: Per action catalog; high-risk external actions always human-approved
cost_budget:
  max_relative_units_per_task: 8
  max_turns: 8
audit_requirements: Every invocation writes an execution-trace span (agent, skills, data, tier, tokens est., cost est., latency, confidence, escalation)
failure_behavior: Return ESCALATE with partial analysis, or CONTRACT result with issues; never fabricate; never act
evaluation:
  suite: evals/action-workflow-agent
  score: null
  last_run: null
