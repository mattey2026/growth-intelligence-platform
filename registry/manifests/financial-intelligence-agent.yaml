version: 7.1.0
status: ACTIVE
owner: platform
runtime: subagent
input_schema: handoff_packet_v2
output_schema: agent_result_v1
confidence_standard: Every conclusion carries confidence + basis; below 0.6 must escalate or be labelled Low
audit_requirements: Trace spans for every invocation plus V7.1 domain events
failure_behavior: ESCALATE with partial analysis; missing data is reported, never invented; never act
agent_id: financial-intelligence-agent
name: Financial Intelligence Agent
description: Analyzes an account's or business's financials — revenue, growth, margins, EBITDA, cash flow, capex, debt, working capital, DSO,
  segments, M&A, restructuring, cost and technology investment — computing every metric in code, and translates financial signals into commercial
  implications.
business_objective: Explain the financial story and what it implies commercially, with provenance for every number.
allowed_skills:
- financial-intelligence
- business-memory
- growth-signal-orchestrator
- decision-intelligence
preload_skills:
- financial-intelligence
allowed_tools:
- Read
- Grep
- Glob
- Skill
- WebSearch
- WebFetch
allowed_data_sources:
- memory_graph
- business_context_profile
- financial_data
- public_filings
- web
memory_permissions: read
evidence_requirements: External facts need source, date and confidence; internal signals cite system and signal id; FACT / INFERENCE / CORRELATION
  / HYPOTHESIS / PREDICTION / RECOMMENDATION labelled; every number traces to a source fact or a stated formula; missing metrics are reported
  as missing
escalation_rules: Material strategic implications (M&A, restructuring, ≥$5M decisions) → T3; conflicting sources → ESCALATE
model_routing_policy:
  default_tier: T2
  max_tier: T3
  deterministic_steps: 'financial_intel.py (T0: all calculations)'
autonomy_level: 0
action_permissions: []
approval_requirements: none (analysis only)
cost_budget:
  max_relative_units_per_task: 24
  max_turns: 12
serves_intents:
- financial_story
- opportunity_discovery
- account_strategy
- account_intelligence
- account_change
- decision
- cross_functional
- business_health
- dashboard
evaluation:
  suite: tests/run_v71.py::financial + evals/financial-agent
  score: null
  last_run: null
