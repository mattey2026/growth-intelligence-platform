# Persona configurations: one intelligence layer, persona-specific presentation.
# kpis: KPI strip order (ids from dashboard_builder.KPI_DEFS)
# tabs: navigation (also filtered by role permissions)
# overview: Overview-view widget order (widget ids)
# altitude: level of detail (enterprise / portfolio / account / deal)
investor:
  label: Investor
  altitude: enterprise
  kpis: [revenue, revenue_growth, margin, growth_potential, risk_exposure, competitive_exposure, opportunity_value, pipeline, forecast]
  tabs: [overview, growth, financial, market, competition, decisions]
  overview: [kpis, state, changes, trend, drivers, financial_summary, radar, risk_matrix, scenario_lab, actions]
  emphasis: [revenue, growth, margin, FCF, market, competitive position, strategic opportunities, risks, scenarios]
