    <rect class="card" x="24" y="350" width="326" height="153" rx="15"/>
    <rect class="card" x="24" y="520" width="326" height="153" rx="15"/>
    <rect class="card" x="24" y="690" width="326" height="153" rx="15"/>
    <rect class="card" x="1186" y="180" width="326" height="153" rx="15"/>
