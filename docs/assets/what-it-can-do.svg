  <rect width="1536" height="1024" rx="20" fill="#FFFFFF"/>
  <g class="sans" text-anchor="middle">
    <text x="768" y="39" font-size="18" font-weight="700" letter-spacing="3" fill="#2457E9">WHAT IT CAN DO</text>
    <text x="768" y="91" font-size="43" font-weight="800" fill="#10182C">Turn Enterprise Data into <tspan fill="url(#title)">Intelligent Decisions</tspan></text>
    <text x="768" y="124" font-size="19" fill="#53627D">Connect your data, add business context, and use Claude-powered agents to find insights, identify opportunities,</text>
    <text x="768" y="151" font-size="19" fill="#53627D">reduce risks, and take action — across your entire business.</text>
  </g>
