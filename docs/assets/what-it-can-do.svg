  <g class="sans">
    <g><circle cx="78" cy="226" r="30" fill="#E1F4FF"/><g fill="#078DCC"><ellipse cx="78" cy="215" rx="13" ry="5"/><path d="M65 215v20c0 7 26 7 26 0v-20c0 7-26 7-26 0z"/><path d="M65 222c0 7 26 7 26 0" fill="none" stroke="#E1F4FF" stroke-width="2"/></g><text class="label" x="119" y="211">Connect Your Data</text><text class="copy" x="119" y="238"><tspan x="119">Integrate enterprise systems:</tspan><tspan x="119" dy="21">CRM, ERP, marketing, documents,</tspan><tspan x="119" dy="21">databases, APIs and MCP tools.</tspan></text></g>
    <g><circle cx="78" cy="396" r="30" fill="#F0E5FF"/><g fill="none" stroke="#8B50EE" stroke-width="3" stroke-linecap="round"><path d="M78 379v31M66 384c-10 0-10 15 0 15M90 384c10 0 10 15 0 15M66 399c-9 0-7 13 3 13M90 399c9 0 7 13-3 13"/></g><text class="label" x="119" y="381">Build Business Memory</text><text class="copy" x="119" y="408"><tspan x="119">Preserve facts, decisions,</tspan><tspan x="119" dy="21">history and outcomes. Understand</tspan><tspan x="119" dy="21">context and what has changed.</tspan></text></g>
    <g><circle cx="78" cy="566" r="30" fill="#DFFAF1"/><g fill="none" stroke="#05A984" stroke-width="3"><circle cx="68" cy="555" r="5"/><circle cx="88" cy="555" r="5"/><circle cx="78" cy="576" r="5"/><path d="M72 558l4 13m12-13l-7 13M73 555h10"/></g><text class="label" x="119" y="551">Use Specialist Agents</text><text class="copy" x="119" y="578"><tspan x="119">Coordinate focused analysis for</tspan><tspan x="119" dy="21">sales, accounts, finance, marketing,</tspan><tspan x="119" dy="21">competition and operations.</tspan></text></g>
    <g><circle cx="78" cy="736" r="30" fill="#FFF0D8"/><g fill="#F39A10"><rect x="65" y="741" width="7" height="14" rx="2"/><rect x="76" y="731" width="7" height="24" rx="2"/><rect x="87" y="720" width="7" height="35" rx="2"/></g><text class="label" x="119" y="721">Get Insights &amp; Predictions</text><text class="copy" x="119" y="748"><tspan x="119">Find opportunities, examine risk,</tspan><tspan x="119" dy="21">explore scenarios and surface</tspan><tspan x="119" dy="21">evidence-backed recommendations.</tspan></text></g>
    <g><circle cx="1240" cy="226" r="30" fill="#FFE7E7"/><circle cx="1240" cy="226" r="15" fill="none" stroke="#EE514B" stroke-width="3"/><circle cx="1240" cy="226" r="7" fill="none" stroke="#EE514B" stroke-width="3"/><path d="M1241 225l16-17m-8 1h8v8" fill="none" stroke="#EE514B" stroke-width="3"/><text class="label" x="1281" y="211">Track What Matters</text><text class="copy" x="1281" y="238"><tspan x="1281">Monitor growth, revenue, pipeline,</tspan><tspan x="1281" dy="21">account risk, competitors, markets</tspan><tspan x="1281" dy="21">and important business metrics.</tspan></text></g>
    <g><circle cx="1240" cy="396" r="30" fill="#DFFAF1"/><g fill="none" stroke="#07AD8D" stroke-width="3" stroke-linecap="round"><circle cx="1240" cy="396" r="7"/><path d="M1240 378v9m0 18v9m-18-18h9m18 0h9m-31-13l7 7m12 12l7 7m0-26l-7 7m-12 12l-7 7"/></g><text class="label" x="1281" y="381">Orchestrate &amp; Take Action</text><text class="copy" x="1281" y="408"><tspan x="1281">Turn insights into prepared actions</tspan><tspan x="1281" dy="21">with workflow integrations and</tspan><tspan x="1281" dy="21">approval-aware next steps.</tspan></text></g>
    <g><circle cx="1240" cy="566" r="30" fill="#FFE7EA"/><path d="M1240 545l17 6v12c0 13-10 20-17 23-7-3-17-10-17-23v-12z" fill="none" stroke="#EA4059" stroke-width="3"/><path d="M1231 564l7 7 12-15" fill="none" stroke="#EA4059" stroke-width="3"/><text class="label" x="1281" y="551">Govern with Confidence</text><text class="copy" x="1281" y="578"><tspan x="1281">Apply permissions, evidence rules,</tspan><tspan x="1281" dy="21">guardrails and human approval</tspan><tspan x="1281" dy="21">for consequential actions.</tspan></text></g>
    <g><circle cx="1240" cy="736" r="30" fill="#E5EEFF"/><g fill="#2457E9"><circle cx="1240" cy="726" r="7"/><circle cx="1227" cy="732" r="5"/><circle cx="1253" cy="732" r="5"/><path d="M1228 751v-5c0-11 24-11 24 0v5zM1217 750v-4c0-7 10-10 14-5M1263 750v-4c0-7-10-10-14-5"/></g><text class="label" x="1281" y="721">Build and Extend</text><text class="copy" x="1281" y="748"><tspan x="1281">Explore the open repository, fork</tspan><tspan x="1281" dy="21">it, customize skills, and add your</tspan><tspan x="1281" dy="21">own agents and integrations.</tspan></text></g>
  </g>
